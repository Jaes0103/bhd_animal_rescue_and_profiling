version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bantay_hayop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bantay_user
      POSTGRES_PASSWORD: bantay_password
      POSTGRES_DB: bantay_hayop_davao
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bantay_user -d bantay_hayop_davao"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bantay_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bantay_hayop_backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://bantay_user:bantay_password@postgres:5432/bantay_hayop_davao
      - JWT_SECRET=bantay_hayop_davao_secret_key_change_in_production_2024
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bantay_network
    command: sh -c "sleep 10 && npm run dev"

  # Frontend React App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bantay_hayop_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bantay_network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local

networks:
  bantay_network:
    driver: bridge
