version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bantay_hayop_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: bantay_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bantay_password_change_me}
      POSTGRES_DB: bantay_hayop_davao
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bantay_user -d bantay_hayop_davao"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bantay_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bantay_hayop_backend_prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://bantay_user:${POSTGRES_PASSWORD:-bantay_password_change_me}@postgres:5432/bantay_hayop_davao
      - JWT_SECRET=${JWT_SECRET:-please_change_this_secret_in_production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bantay_network
    command: sh -c "sleep 10 && npm start"

  # Frontend with Nginx
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: bantay_hayop_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bantay_network

volumes:
  postgres_data:
    driver: local

networks:
  bantay_network:
    driver: bridge
